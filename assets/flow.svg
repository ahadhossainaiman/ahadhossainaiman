<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="How Ahad ships: client to edge to API to database, with real-time, payments and AI services" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#14103a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .t { font-size: 18px; font-weight: 700; fill: #f1f5f9; text-anchor: middle; }
    .s { font-size: 13px; fill: #94a3b8; text-anchor: middle; }
    .sm { font-size: 14px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
    .node { fill: #0f172a; stroke-width: 1.5; }
    .wire { fill: none; stroke-width: 2; stroke-dasharray: 6 6; stroke-linecap: round; }
    @keyframes pulse { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
    .n { animation: pulse 3s ease-in-out infinite; }
    .n2 { animation: pulse 3s ease-in-out infinite .75s; }
    .n3 { animation: pulse 3s ease-in-out infinite 1.5s; }
    .n4 { animation: pulse 3s ease-in-out infinite 2.25s; }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <text x="50" y="44" font-size="13" font-weight="700" letter-spacing="4" fill="#64748b">FROM FIGMA TO PRODUCTION</text>

    <!-- wires -->
    <path class="wire" d="M270 110 L330 110" stroke="#22d3ee"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path class="wire" d="M550 110 L610 110" stroke="#f59e0b"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path class="wire" d="M830 110 L890 110" stroke="#a78bfa"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path class="wire" d="M720 150 L530 205" stroke="#a78bfa" stroke-opacity=".7"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.4s" repeatCount="indefinite"/></path>
    <path class="wire" d="M720 150 L720 205" stroke="#a78bfa" stroke-opacity=".7"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.4s" repeatCount="indefinite"/></path>
    <path class="wire" d="M720 150 L910 205" stroke="#a78bfa" stroke-opacity=".7"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.4s" repeatCount="indefinite"/></path>

    <!-- travelling packets -->
    <circle r="5" fill="#22d3ee"><animateMotion dur="1.6s" repeatCount="indefinite" path="M270 110 L330 110"/></circle>
    <circle r="5" fill="#f59e0b"><animateMotion dur="1.6s" begin=".4s" repeatCount="indefinite" path="M550 110 L610 110"/></circle>
    <circle r="5" fill="#a78bfa"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite" path="M830 110 L890 110"/></circle>
    <circle r="4" fill="#c4b5fd"><animateMotion dur="2s" repeatCount="indefinite" path="M720 150 L530 205"/></circle>
    <circle r="4" fill="#c4b5fd"><animateMotion dur="2s" begin=".5s" repeatCount="indefinite" path="M720 150 L720 205"/></circle>
    <circle r="4" fill="#c4b5fd"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M720 150 L910 205"/></circle>

    <!-- main nodes -->
    <g class="n">
      <rect class="node" x="50" y="70" width="220" height="80" rx="16" stroke="#22d3ee"/>
      <text class="t" x="160" y="104">Client</text>
      <text class="s" x="160" y="128">Next.js · React · Tailwind</text>
    </g>
    <g class="n2">
      <rect class="node" x="330" y="70" width="220" height="80" rx="16" stroke="#f59e0b"/>
      <text class="t" x="440" y="104">Edge</text>
      <text class="s" x="440" y="128">Cloudflare · Nginx</text>
    </g>
    <g class="n3">
      <rect class="node" x="610" y="70" width="220" height="80" rx="16" stroke="#a78bfa"/>
      <text class="t" x="720" y="104">API</text>
      <text class="s" x="720" y="128">Node · Express · TypeScript</text>
    </g>
    <g class="n4">
      <rect class="node" x="890" y="70" width="220" height="80" rx="16" stroke="#34d399"/>
      <text class="t" x="1000" y="104">Data</text>
      <text class="s" x="1000" y="128">MongoDB · PostgreSQL</text>
    </g>

    <!-- service nodes -->
    <g>
      <rect class="node" x="445" y="205" width="170" height="56" rx="14" stroke="#a78bfa" stroke-opacity=".7"/>
      <text class="sm" x="530" y="238">Socket.IO · real-time</text>
      <rect class="node" x="635" y="205" width="170" height="56" rx="14" stroke="#a78bfa" stroke-opacity=".7"/>
      <text class="sm" x="720" y="238">Stripe · PayFast</text>
      <rect class="node" x="825" y="205" width="170" height="56" rx="14" stroke="#a78bfa" stroke-opacity=".7"/>
      <text class="sm" x="910" y="238">Gemini · AI chat</text>
    </g>

    <!-- devops -->
    <rect class="node" x="50" y="205" width="330" height="56" rx="14" stroke="#64748b" stroke-dasharray="5 5"/>
    <text class="sm" x="215" y="231">Docker · PM2 · CI/CD</text>
    <text class="s" x="215" y="250">Linux VPS · AWS · Hostinger</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
