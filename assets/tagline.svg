<g clip-path="url(#round)"><rect width="1200" height="84" fill="url(#bg)"/><rect width="1200" height="84" fill="url(#grid)"/><text class="mono" x="48" y="53" font-size="26" font-weight="700" fill="#34d399">$</text><text class="mono" x="600" y="52" font-size="26" font-weight="700" fill="url(#tg)" text-anchor="middle" opacity="1">AI-integrated full stack apps, shipped to production<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.22;0.25;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="66;52;52;38;38" keyTimes="0;0.03;0.22;0.25;1" dur="12s" repeatCount="indefinite"/></text><circle cx="1090" cy="42" r="4" fill="#22d3ee" opacity=".25"><animate attributeName="opacity" values="0.25;1;1;0.25;0.25" keyTimes="0;0.03;0.22;0.25;1" dur="12s" repeatCount="indefinite"/></circle><text class="mono" x="600" y="66" font-size="26" font-weight="700" fill="url(#tg)" text-anchor="middle" opacity="0">Node.js + TypeScript backends that scale<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.47;0.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="66;66;52;52;38;38" keyTimes="0;0.25;0.28;0.47;0.5;1" dur="12s" repeatCount="indefinite"/></text><circle cx="1110" cy="42" r="4" fill="#22d3ee" opacity=".25"><animate attributeName="opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.25;0.28;0.47;0.5;1" dur="12s" repeatCount="indefinite"/></circle><text class="mono" x="600" y="66" font-size="26" font-weight="700" fill="url(#tg)" text-anchor="middle" opacity="0">Docker · Nginx · PM2 · CI/CD, commit to live<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.72;0.75;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="66;66;52;52;38;38" keyTimes="0;0.5;0.53;0.72;0.75;1" dur="12s" repeatCount="indefinite"/></text><circle cx="1130" cy="42" r="4" fill="#22d3ee" opacity=".25"><animate attributeName="opacity" values="0.25;0.25;1;1;0.25;0.25" keyTimes="0;0.5;0.53;0.72;0.75;1" dur="12s" repeatCount="indefinite"/></circle><text class="mono" x="600" y="66" font-size="26" font-weight="700" fill="url(#tg)" text-anchor="middle" opacity="0">Gemini-powered chatbots with real admin control<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.97;1" dur="12s" repeatCount="indefinite"/><animate attributeName="y" values="66;66;52;52;38" keyTimes="0;0.75;0.78;0.97;1" dur="12s" repeatCount="indefinite"/></text><circle cx="1150" cy="42" r="4" fill="#22d3ee" opacity=".25"><animate attributeName="opacity" values="0.25;0.25;1;1;0.25" keyTimes="0;0.75;0.78;0.97;1" dur="12s" repeatCount="indefinite"/></circle><rect x="60" y="72" width="220" height="2" rx="1" fill="url(#sw)"><animate attributeName="x" values="40;940;40" dur="6s" repeatCount="indefinite"/></rect></g>
