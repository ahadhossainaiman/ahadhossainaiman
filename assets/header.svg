<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ahad Hossain Aiman, Senior Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#1b1147"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="g1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .r1 { animation: rise .9s .1s both; }
    .r2 { animation: rise .9s .35s both; }
    .r3 { animation: rise .9s .6s both; }
    .r4 { animation: rise .9s .85s both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .f1 { animation: float 6s ease-in-out infinite; }
    .f2 { animation: float 8s ease-in-out infinite 1s; }
    .f3 { animation: float 7s ease-in-out infinite 2s; }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- glowing blobs -->
    <circle cx="1000" cy="60" r="260" fill="url(#g1)">
      <animate attributeName="cx" values="1000;900;1000" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;120;60" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="330" r="240" fill="url(#g2)">
      <animate attributeName="cx" values="200;320;200" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- big faded code glyph -->
    <text class="mono f1" x="860" y="230" font-size="190" font-weight="700" fill="#ffffff" fill-opacity=".06">&lt;/&gt;</text>

    <!-- floating particles -->
    <circle class="f2" cx="760" cy="70" r="4" fill="#22d3ee" fill-opacity=".7"/>
    <circle class="f3" cx="1090" cy="150" r="5" fill="#f472b6" fill-opacity=".7"/>
    <circle class="f1" cx="930" cy="290" r="3" fill="#a78bfa" fill-opacity=".8"/>
    <circle class="f3" cx="640" cy="40" r="3" fill="#a78bfa" fill-opacity=".6"/>
    <circle class="f2" cx="1140" cy="260" r="4" fill="#22d3ee" fill-opacity=".6"/>

    <!-- window dots -->
    <circle cx="80" cy="46" r="6" fill="#ff5f57"/>
    <circle cx="102" cy="46" r="6" fill="#febc2e"/>
    <circle cx="124" cy="46" r="6" fill="#28c840"/>
    <text class="mono" x="150" y="51" font-size="13" fill="#64748b">~/ahad/portfolio — zsh</text>

    <!-- name -->
    <text class="r1" x="80" y="150" font-size="62" font-weight="800" letter-spacing="2" fill="url(#name)">AHAD HOSSAIN AIMAN</text>
    <text class="r2" x="82" y="194" font-size="24" font-weight="600" letter-spacing="7" fill="#cbd5e1">SENIOR FULL STACK DEVELOPER</text>
    <text class="mono r3" x="82" y="232" font-size="18" fill="#22d3ee">&gt; node · react · typescript · shipping real products<tspan class="cursor" fill="#f472b6">_</tspan></text>

    <!-- stat pills -->
    <g class="r4">
      <rect x="80" y="262" width="190" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="175" y="284" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">30+ projects shipped</text>

      <rect x="286" y="262" width="120" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="346" y="284" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">3+ years</text>

      <rect x="422" y="262" width="175" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="509.5" y="284" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">~40% faster APIs</text>

      <rect x="613" y="262" width="200" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="713" y="284" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">500+ live connections</text>

      <rect x="829" y="262" width="215" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="936.5" y="284" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">App Store + Google Play</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
